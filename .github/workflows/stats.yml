name: Update player stats

on:
  schedule:
    - cron: "30 4 * * *"   # every day, 04:30 UTC
  workflow_dispatch:        # lets you press "Run workflow" yourself

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build players.json and match files
        run: python stats.py
      - name: Save if changed
        run: |
          git config user.name "stats-bot"
          git config user.email "stats-bot@users.noreply.github.com"
          git add players.json matches
          git diff --cached --quiet || (git commit -m "Update player stats" && git push)
